<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset="0.52" stop-color="#F5F8FF"/>
    <stop offset="1" stop-color="#F7F3FF"/>
  </linearGradient>
  <linearGradient id="line" x1="120" y1="120" x2="1080" y2="330" gradientUnits="userSpaceOnUse">
    <stop stop-color="#2563EB"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="text" x1="120" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0F172A"/>
    <stop offset="0.75" stop-color="#1D4ED8"/>
    <stop offset="1" stop-color="#6D28D9"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#334155" flood-opacity="0.12"/>
  </filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" stroke="#CBD5E1" stroke-opacity="0.28"/>
  </pattern>
  <style>
    .eyebrow{font:600 13px Inter,Segoe UI,Arial,sans-serif;letter-spacing:2.2px;fill:#2563EB}
    .name{font:800 58px Inter,Segoe UI,Arial,sans-serif;letter-spacing:-2px;fill:url(#text)}
    .role{font:500 19px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
    .small{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#64748B;letter-spacing:1px}
    .pill{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#1E293B}
  </style>
</defs>

<rect width="1200" height="420" rx="30" fill="url(#bg)"/>
<rect x="760" y="0" width="440" height="420" fill="url(#grid)" opacity="0.72"/>

<circle cx="1040" cy="88" r="170" fill="#DBEAFE" opacity="0.52">
  <animate attributeName="r" values="165;182;165" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="1090" cy="340" r="150" fill="#EDE9FE" opacity="0.62">
  <animate attributeName="r" values="145;162;145" dur="7s" repeatCount="indefinite"/>
</circle>

<g filter="url(#shadow)">
  <rect x="42" y="42" width="1116" height="336" rx="26" fill="white" fill-opacity="0.88" stroke="#E2E8F0"/>
</g>

<!-- Monogram -->
<g transform="translate(88 92)">
  <rect width="76" height="76" rx="22" fill="#0F172A"/>
  <path d="M22 27H43C53 27 59 32 59 40C59 48 53 53 43 53H31V64H22V27ZM31 35V45H42C47 45 50 43 50 40C50 37 47 35 42 35H31Z" fill="white"/>
  <path d="M45 55L56 64H43L35 57L45 55Z" fill="#60A5FA"/>
  <rect x="21" y="66" width="38" height="3" rx="1.5" fill="url(#line)"/>
</g>

<text x="190" y="92" class="eyebrow">PRAJAN.SYS / ENGINEERING PORTFOLIO</text>
<text x="190" y="160" class="name">Prajan Sanjay K</text>
<text x="190" y="198" class="role">Cybersecurity • AI / ML • Cloud Engineering • Full-Stack Development</text>
<text x="190" y="228" class="small">BUILDING SECURE SYSTEMS · INTELLIGENT PRODUCTS · CLOUD-NATIVE INFRASTRUCTURE</text>

<rect x="190" y="254" width="146" height="36" rx="18" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="263" y="277" text-anchor="middle" class="pill">CYBERSECURITY</text>
<rect x="348" y="254" width="108" height="36" rx="18" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="402" y="277" text-anchor="middle" class="pill">AI / ML</text>
<rect x="468" y="254" width="108" height="36" rx="18" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="522" y="277" text-anchor="middle" class="pill">CLOUD</text>
<rect x="588" y="254" width="152" height="36" rx="18" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="664" y="277" text-anchor="middle" class="pill">FULL STACK</text>

<!-- Engineering signal -->
<g transform="translate(850 108)">
  <circle cx="100" cy="100" r="82" fill="white" stroke="#E2E8F0"/>
  <circle cx="100" cy="100" r="61" fill="none" stroke="url(#line)" stroke-width="3" stroke-dasharray="9 8">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="30" fill="#0F172A"/>
  <path d="M86 100H114M100 86V114" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="7" fill="#60A5FA">
    <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="18" r="5" fill="#2563EB"/>
  <circle cx="174" cy="100" r="5" fill="#7C3AED"/>
  <circle cx="100" cy="182" r="5" fill="#2563EB"/>
  <circle cx="26" cy="100" r="5" fill="#7C3AED"/>
</g>

<text x="868" y="310" class="small">ENGINEERING / RESEARCH</text>
<path d="M868 326H1088" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8">
  <animate attributeName="stroke-dashoffset" values="0;-56" dur="2.2s" repeatCount="indefinite"/>
</path>
<text x="88" y="346" class="small">CHENNAI · INDIA</text>
<text x="1110" y="346" text-anchor="end" class="small">OPEN TO BUILD</text>
</svg>
